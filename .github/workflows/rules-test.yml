# Runs every case in tests/rules/matrix.mjs against the REAL firestore.rules in Google's
# Firestore emulator (Java + emulator jar, which the build sandbox could not download).
name: Security rules test
on:
  push:
    paths: ["firebase/**", "tests/rules/**", ".github/workflows/rules-test.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: tools/package-lock.json }
      - run: npm ci
        working-directory: tools
      - name: Rules model tests (fast)
        run: node --test tests/rules/model.test.mjs
      - name: Real rules in the Firestore emulator
        working-directory: tools
        run: npx firebase emulators:exec --project demo-fl10 --config ../firebase/firebase.json --only firestore "node --test --test-reporter=spec ../tests/rules/emulator.test.mjs"
