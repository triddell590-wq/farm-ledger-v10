<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Farm Ledger">
  <title>Farm Ledger</title>
  <!-- Tile: drumlin grass -->
  <rect width="64" height="64" rx="15" fill="#2F5D3A"/>
  <!-- The drumlin: steep at one end, long gentle tail, as mid-Ulster hills are.
       Ruled across like a page of a ledger. -->
  <clipPath id="fl-logo-hill"><path d="M9 42.5C10.5 31 17 21.5 26 21.5c10.5 0 20 11 29 21z"/></clipPath>
  <g clip-path="url(#fl-logo-hill)">
    <rect width="64" height="64" fill="#ECEFE8"/>
    <path d="M0 29.5h64M0 36.5h64" stroke="#2F5D3A" stroke-width="2.6"/>
  </g>
  <!-- The accountant's double rule under a total, in whin gold -->
  <path d="M9 42.5h46M9 48h46" stroke="#E2AE2B" stroke-width="2.6" stroke-linecap="round"/>
</svg>
