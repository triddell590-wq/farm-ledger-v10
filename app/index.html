<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Farm Ledger</title>
<meta name="description" content="Every animal, every record, every pound. Farm records for Northern Ireland farms — works with no signal.">
<meta name="theme-color" content="#ECEFE8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Farm Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/photos.css">
<link rel="stylesheet" href="css/print.css">
<script>
/* Apply the phone's appearance choice before first paint (no light flash in dark mode). */
try { var a = JSON.parse(localStorage.getItem("fl10-appearance") || "{}");
  if (a.theme === "light" || a.theme === "dark") document.documentElement.dataset.theme = a.theme;
  if (a.reduceMotion || matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("reduce-motion");
  if (a.hiVis) document.documentElement.classList.add("hi-vis"); } catch (e) {}
</script>
</head>
<body>
<!-- Splash: the logo at rest, exactly where the animated splash draws it (design/00 §8.2). -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="mark">
    <svg viewBox="0 0 64 64" width="96" height="96">
      <rect class="sp-tile" width="64" height="64" rx="15" fill="#2F5D3A"/>
      <clipPath id="sp-clip"><path d="M9 42.5C10.5 31 17 21.5 26 21.5c10.5 0 20 11 29 21z"/></clipPath>
      <g clip-path="url(#sp-clip)"><g class="sp-hill"><rect width="64" height="64" fill="#ECEFE8"/>
        <path class="sp-rule r1" d="M0 29.5h64" stroke="#2F5D3A" stroke-width="2.6"/>
        <path class="sp-rule r2" d="M0 36.5h64" stroke="#2F5D3A" stroke-width="2.6"/></g></g>
      <path class="sp-gold g1" d="M9 42.5h46" stroke="#E2AE2B" stroke-width="2.6" stroke-linecap="round"/>
      <path class="sp-gold g2" d="M9 48h46" stroke="#E2AE2B" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div class="word">Farm Ledger</div>
    <div class="progress"></div>
    <div class="slow">Getting your farm ready…</div>
  </div>
  <div class="tagline">Every animal, every record, every pound.</div>
</div>
<div id="app">
  <main id="stage" class="stage"></main>
</div>
<div id="boot-error" hidden style="position:fixed;inset:0;z-index:200;background:var(--bg);padding:48px 24px;font-family:var(--font)">
  <h1 class="t-title">Farm Ledger didn't start</h1>
  <p class="t-body ink-2" style="margin-top:12px">Close the app and open it again. If it keeps happening, this message helps us fix it:</p>
  <code style="display:block;margin-top:12px;font-size:14px;word-break:break-all"></code>
</div>
<noscript><p style="padding:24px">Farm Ledger needs JavaScript switched on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
